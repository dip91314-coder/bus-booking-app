services:
  # 1. MongoDB with Single-Node Replica Set (supports atomic transactions)
  mongo:
    image: mongo:7.0
    container_name: yatrabus-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "
          try {
            var st = rs.status();
            if (st.ok === 1) quit(0);
          } catch (e) {
            rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] });
            quit(0);
          }
        "
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s

  # 2. Redis Cache & Distributed Lock Service
  redis:
    image: redis:7-alpine
    container_name: yatrabus-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Backend Express API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yatrabus-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/busbooking?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
      - REDIS_ENABLED=true
      - JWT_SECRET=super_secret_jwt_access_key_min_32_characters_long
      - JWT_REFRESH_SECRET=super_secret_jwt_refresh_key_min_32_characters_long
      - CLIENT_URL=http://localhost
      - CORS_ORIGIN=http://localhost
      - LOCK_MINUTES=8
      - ADMIN_SEED_PASSWORD=admin123
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Frontend React / Vite Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5000/api
        - VITE_API_URL=http://localhost:5000/api
    container_name: yatrabus-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data:
    name: yatrabus-mongo-data
  redis-data:
    name: yatrabus-redis-data
